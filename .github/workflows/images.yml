name: Images

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  # A pull request builds every image, for both platforms, and pushes none:
  # a broken Dockerfile fails here.
  build:
    name: Build ${{ matrix.cmd }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [cadre-server, cadre-runner, cadre]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=pr-${{ github.event.number }}
          push: false
          cache-from: type=gha,scope=${{ matrix.cmd }}

  # main and v* tags publish to ghcr.io/<owner>/<command>.
  publish:
    name: Publish ${{ matrix.cmd }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        cmd: [cadre-server, cadre-runner, cadre]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.cmd }}
          # vX.Y.Z, vX.Y and latest on a tag; main and sha-<short> on main.
          tags: |
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}
          flavor: latest=auto
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ steps.meta.outputs.version }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.cmd }}
          cache-to: type=gha,mode=max,scope=${{ matrix.cmd }}
