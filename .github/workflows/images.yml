# Every image, for both platforms, built and pushed nowhere: a broken
# Dockerfile fails here.
name: images

on:
  workflow_call:
    inputs:
      version:
        description: The version the binaries print.
        type: string
        required: true

permissions:
  contents: read

jobs:
  image:
    name: Build ${{ matrix.cmd }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cmd: [cadre-server, cadre-runner, cadre]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            CMD=${{ matrix.cmd }}
            VERSION=${{ inputs.version }}
          push: false
          cache-from: type=gha,scope=${{ matrix.cmd }}
