# go vet and golangci-lint.
name: lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Vet and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/tools-cache
      - name: Vet
        run: go vet ./...
      - name: Lint
        run: make lint
