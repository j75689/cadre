# Every push to main and every pull request: the checks, each its own
# workflow; on a pull request the images built for both platforms; the
# install in kind; and on main the images published as main and
# main-<short sha>, once all of that passed on the same commit. v* tags are
# released by release.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A pull request's newer push replaces its running checks. Each push to main
# is a group of its own, so none is cancelled here. publish.yml's push still
# runs one at a time per command, so that an older build never moves :main
# back: :main always ends at the newest commit, while an intermediate
# commit's main-<sha> may be skipped when three land within one build.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    uses: ./.github/workflows/fmt.yml
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
  web:
    uses: ./.github/workflows/web.yml
  chart:
    uses: ./.github/workflows/chart.yml

  images:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/images.yml
    with:
      version: pr-${{ github.event.number }}

  e2e:
    needs: [fmt, lint, test, web, chart]
    uses: ./.github/workflows/e2e.yml

  # A broken install does not move :main.
  publish:
    if: github.event_name == 'push'
    needs: [fmt, lint, test, web, chart, e2e]
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      packages: write
