# Cadre install.yaml: the insecure, bring-your-own-bucket form.
#
# This is the Helm chart rendered with auth.mode=none and the S3 bucket
# CHANGE-ME. There are no logins: anyone who reaches cadre-server may act as
# anyone, and everyone is an admin of every team. Use it to try Cadre, never
# where others can reach it. The supported install is the chart:
#
#   helm install cadre oci://ghcr.io/j75689/charts/cadre -n cadre-system --create-namespace
#
# To use this file:
#   1. kubectl create namespace cadre-system
#      It must be cadre-system: the objects carry no namespace, while the
#      ClusterRoleBindings' subjects and cadre-server's --leader-elect-namespace
#      and --builtin-runner arguments below name it.
#   2. Set the bucket: replace --s3-bucket=CHANGE-ME in cadre-server's args.
#      For a store other than AWS S3, add --s3-endpoint=<URL>, change
#      --s3-path-style to true if it needs it, and add the CADRE_S3_ACCESS_KEY
#      and CADRE_S3_SECRET_KEY env vars. Or render it afresh from the chart:
#        helm template cadre oci://ghcr.io/j75689/charts/cadre --version <X.Y.Z> \
#          -n cadre-system --include-crds --set auth.mode=none \
#          --set storage.s3.bucket=<bucket> --set storage.s3.endpoint=<URL>
#   3. kubectl apply --server-side -n cadre-system -f install.yaml
#   4. Bind the per-Team ClusterRoles in each Team namespace, as the chart's
#      README shows.
