---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: modelproviders.cadre.dev
spec:
  group: cadre.dev
  names:
    kind: ModelProvider
    listKind: ModelProviderList
    plural: modelproviders
    singular: modelprovider
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.type
      name: Type
      type: string
    - jsonPath: .spec.model
      name: Model
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelProvider is a model, its endpoint and its credentials.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelProviderSpec says how to reach one model.
            properties:
              auth:
                description: |-
                  Auth is the API key. Bedrock and Vertex can use workload identity
                  instead.
                properties:
                  secretRef:
                    description: SecretRef is the Secret key holding the credential.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret's name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - secretRef
                type: object
              baseURL:
                description: |-
                  BaseURL overrides the provider's endpoint: an OpenAI-compatible
                  server, or a gateway in front of the provider.
                pattern: ^https?://
                type: string
              location:
                description: Location is the Google Cloud location, such as us-east5,
                  for vertex.
                minLength: 1
                type: string
              model:
                description: Model is the model to use, as the provider names it.
                minLength: 1
                type: string
              project:
                description: Project is the Google Cloud project, for vertex.
                minLength: 1
                type: string
              region:
                description: Region is the AWS region, for bedrock.
                minLength: 1
                type: string
              type:
                description: |-
                  Type is the model API: anthropic, openai (any OpenAI-compatible
                  endpoint), bedrock or vertex.
                enum:
                - anthropic
                - openai
                - bedrock
                - vertex
                type: string
              workloadIdentity:
                description: |-
                  WorkloadIdentity authenticates to Bedrock or Vertex as the
                  ServiceAccount, with no key.
                type: boolean
            required:
            - model
            - type
            type: object
            x-kubernetes-validations:
            - message: anthropic and openai providers need auth
              rule: '!(self.type in [''anthropic'', ''openai'']) || has(self.auth)'
            - message: bedrock and vertex providers need auth or workloadIdentity
              rule: '!(self.type in [''bedrock'', ''vertex'']) || has(self.auth) ||
                (has(self.workloadIdentity) && self.workloadIdentity)'
            - message: baseURL is for anthropic and openai providers
              rule: '!has(self.baseURL) || self.type in [''anthropic'', ''openai'']'
            - message: workloadIdentity is for bedrock and vertex providers
              rule: '!(has(self.workloadIdentity) && self.workloadIdentity) || self.type
                in [''bedrock'', ''vertex'']'
            - message: bedrock providers need region
              rule: self.type != 'bedrock' || has(self.region)
            - message: vertex providers need project and location
              rule: self.type != 'vertex' || (has(self.project) && has(self.location))
            - message: region is for bedrock providers
              rule: '!has(self.region) || self.type == ''bedrock'''
            - message: project and location are for vertex providers
              rule: '!(has(self.project) || has(self.location)) || self.type == ''vertex'''
          status:
            description: |-
              ConfigStatus is the status of a configuration resource: whether it can be
              used, and for which generation of its spec that was decided.
            properties:
              conditions:
                description: |-
                  Conditions are the standard Kubernetes conditions; Ready says whether
                  the resource can be used.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
