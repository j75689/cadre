---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: runners.cadre.dev
spec:
  group: cadre.dev
  names:
    kind: Runner
    listKind: RunnerList
    plural: runners
    singular: runner
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceAccount.name
      name: ServiceAccount
      type: string
    - jsonPath: .status.tokenSecret
      name: Token
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          Runner is a runner allowed to claim tasks in its namespace: Cadre's
          tenant boundary. A runner serving several Teams has a Runner in each.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              RunnerSpec says who a runner is and which agents' tasks it may claim in
              its namespace.
            properties:
              labels:
                additionalProperties:
                  type: string
                description: |-
                  Labels are what the runner's claims are matched with: an agent of
                  runtime type runner whose selector they include. The server takes
                  them from here, never from the runner's request. The cadre.dev/
                  prefix is reserved. A Runner without labels could claim nothing.
                minProperties: 1
                type: object
                x-kubernetes-validations:
                - message: the cadre.dev/ label prefix is reserved
                  rule: self.all(k, !k.startsWith('cadre.dev/'))
              serviceAccount:
                description: |-
                  ServiceAccount, for a runner in the cluster, is the ServiceAccount it
                  authenticates as, with a projected token for the audience cadre. It
                  is the ServiceAccount of that name in the Runner's own namespace: a
                  Team cannot enlist another Team's runner. Without it the runner is outside the cluster, and
                  Cadre mints a token for it into the Secret <name>-token.
                properties:
                  name:
                    minLength: 1
                    type: string
                required:
                - name
                type: object
            required:
            - labels
            type: object
          status:
            description: RunnerStatus is a Runner's status.
            properties:
              conditions:
                description: |-
                  Conditions are the standard Kubernetes conditions; Ready says whether
                  the resource can be used.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              mintedAt:
                description: |-
                  MintedAt is when the status first held the current token's hash:
                  when Cadre minted it, or took it from the Secret, where a token
                  written by hand is taken as a new one.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
              tokenHash:
                description: |-
                  TokenHash is the SHA-256 of the minted token, hex. A token whose
                  hash is not this one is refused, so replacing the Secret's token
                  revokes the old one.
                type: string
              tokenSecret:
                description: TokenSecret is the Secret holding the minted token.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: 'a Runner''s name is a DNS label (at most 63 characters, no dot):
            it names the Secret <name>-token and labels it'
          optionalOldSelf: true
          rule: oldSelf.hasValue() || (size(self.metadata.name) <= 63 && !self.metadata.name.contains('.'))
    served: true
    storage: true
    subresources:
      status: {}
