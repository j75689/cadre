---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: notifiers.cadre.dev
spec:
  group: cadre.dev
  names:
    kind: Notifier
    listKind: NotifierList
    plural: notifiers
    singular: notifier
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.on
      name: "On"
      type: string
    - jsonPath: .spec.webhook.url
      name: URL
      type: string
    - jsonPath: .spec.toolServer.tool
      name: Tool
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.lastSent
      name: Last sent
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Notifier tells a channel when a task needs a human or ends.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: 'NotifierSpec says what to notify of, and where: a webhook
              or a tool.'
            properties:
              "on":
                description: On lists the events notified.
                items:
                  description: |-
                    NotifyEvent is what a Notifier is told of: a task starting to wait on a
                    human, for one of the Waiting reasons, or ending.
                  enum:
                  - Question
                  - ToolApproval
                  - Review
                  - Done
                  - Failed
                  - Cancelled
                  type: string
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              toolServer:
                description: ToolServer is an MCP tool notifications are sent to.
                properties:
                  arguments:
                    additionalProperties:
                      type: string
                    description: Arguments are static arguments passed with every
                      call.
                    type: object
                  name:
                    description: Name is the ToolServer.
                    minLength: 1
                    type: string
                  tool:
                    description: |-
                      Tool is the tool called. The ToolServer's permissions must allow it:
                      a notification cannot wait for a human to approve the call.
                    minLength: 1
                    type: string
                required:
                - name
                - tool
                type: object
                x-kubernetes-validations:
                - message: the argument notification is the notification itself
                  rule: '!has(self.arguments) || !(''notification'' in self.arguments)'
              webhook:
                description: Webhook is an HTTP endpoint notifications are POSTed
                  to.
                properties:
                  headers:
                    additionalProperties:
                      type: string
                    description: Headers are static headers sent with every delivery.
                    type: object
                  secretRef:
                    description: |-
                      SecretRef is a Secret key holding a signing secret: when set, every
                      delivery carries X-Cadre-Signature: sha256=<hex HMAC-SHA256 of the
                      body under the secret>.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret's name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  url:
                    description: |-
                      URL receives the POSTs. It holds no credentials: they would travel
                      as an Authorization header; sign with SecretRef instead.
                    pattern: ^https?://[^/@?#]+(?:[/?#].*)?$
                    type: string
                required:
                - url
                type: object
                x-kubernetes-validations:
                - message: 'headers are static and readable by anyone who can read
                    the Notifier: put no credential there; set secretRef, and the
                    receiver checks the signature'
                  rule: '!has(self.headers) || !self.headers.exists(k, k.lowerAscii()
                    == ''authorization'')'
            required:
            - "on"
            type: object
            x-kubernetes-validations:
            - message: set exactly one of webhook and toolServer
              rule: has(self.webhook) != has(self.toolServer)
          status:
            description: NotifierStatus is a Notifier's status.
            properties:
              conditions:
                description: |-
                  Conditions are the standard Kubernetes conditions; Ready says whether
                  the resource can be used.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastError:
                description: LastError is the last delivery that failed.
                properties:
                  at:
                    description: At is when.
                    format: date-time
                    type: string
                  message:
                    description: Message says how it failed.
                    type: string
                required:
                - at
                - message
                type: object
              lastSent:
                description: LastSent is when a notification was last delivered.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
