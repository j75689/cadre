              tokenHash:
                description: |-
                  TokenHash is the SHA-256 of the minted token, hex. A token whose
                  hash is not this one is refused, so replacing the Secret's token
                  revokes the old one.
                type: string
              tokenSecret:
                description: TokenSecret is the Secret holding the minted token.
                type: string
            type: object
