---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: toolservers.cadre.dev
spec:
  group: cadre.dev
  names:
    kind: ToolServer
    listKind: ToolServerList
    plural: toolservers
    singular: toolserver
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.url
      name: URL
      type: string
    - jsonPath: .status.url
      name: Managed
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ToolServer is one MCP server an agent may use.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ToolServerSpec describes one MCP server: an external one at a URL, or one
              Cadre runs.
            properties:
              auth:
                description: |-
                  Auth is the credential Cadre sends to the server. It never reaches
                  the agent.
                properties:
                  header:
                    default: Authorization
                    description: Header is the request header that carries the credential.
                    pattern: ^[A-Za-z0-9-]+$
                    type: string
                  prefix:
                    default: 'Bearer '
                    description: |-
                      Prefix goes before the credential in the header; empty for a bare
                      key such as X-API-Key.
                    type: string
                  secretRef:
                    description: SecretRef is the Secret key holding the credential.
                    properties:
                      key:
                        description: Key is the key within the Secret.
                        minLength: 1
                        type: string
                      name:
                        description: Name is the Secret's name.
                        minLength: 1
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - secretRef
                type: object
              managed:
                description: 'Managed makes Cadre run the server: a Deployment and
                  a Service.'
                properties:
                  image:
                    description: Image is the server's container image.
                    minLength: 1
                    type: string
                  path:
                    default: /mcp
                    description: Path is the MCP endpoint's path on the server; default
                      /mcp.
                    pattern: ^/
                    type: string
                  port:
                    description: Port is the port the server listens on.
                    format: int32
                    maximum: 65535
                    minimum: 1
                    type: integer
                  readinessProbe:
                    description: |-
                      ReadinessProbe replaces the server container's default readiness
                      probe, a TCP connect to Port, for a server with a health endpoint.
                    properties:
                      exec:
                        description: Exec specifies a command to execute in the container.
                        properties:
                          command:
                            description: |-
                              Command is the command line to execute inside the container, the working directory for the
                              command  is root ('/') in the container's filesystem. The command is simply exec'd, it is
                              not run inside a shell, so traditional shell instructions ('|', etc) won't work. To use
                              a shell, you need to explicitly call out to that shell.
                              Exit status of 0 is treated as live/healthy and non-zero is unhealthy.
                            items:
                              type: string
                            type: array
                            x-kubernetes-list-type: atomic
                        type: object
                      failureThreshold:
                        description: |-
                          Minimum consecutive failures for the probe to be considered failed after having succeeded.
                          Defaults to 3. Minimum value is 1.
                        format: int32
                        type: integer
                      grpc:
                        description: GRPC specifies a GRPC HealthCheckRequest.
                        properties:
                          mode:
                            description: |-
                              mode specifies the connection mode for the gRPC health probe.
                              Set to "TLS" to use TLS without certificate verification.
                              Set to "Plaintext" to use a plaintext (insecure) connection explicitly.
                              If not specified, the probe uses a plaintext (insecure) connection.
                            type: string
                          port:
                            description: Port number of the gRPC service. Number must
                              be in the range 1 to 65535.
                            format: int32
                            type: integer
                          service:
                            default: ""
                            description: |-
                              Service is the name of the service to place in the gRPC HealthCheckRequest
                              (see https://github.com/grpc/grpc/blob/master/doc/health-checking.md).

                              If this is not specified, the default behavior is defined by gRPC.
                            type: string
                        required:
                        - port
                        type: object
                      httpGet:
                        description: HTTPGet specifies an HTTP GET request to perform.
                        properties:
                          host:
                            description: |-
                              Host name to connect to, defaults to the pod IP. You probably want to set
                              "Host" in httpHeaders instead.
                            type: string
                          httpHeaders:
                            description: Custom headers to set in the request. HTTP
                              allows repeated headers.
                            items:
                              description: HTTPHeader describes a custom header to
                                be used in HTTP probes
                              properties:
                                name:
                                  description: |-
                                    The header field name.
                                    This will be canonicalized upon output, so case-variant names will be understood as the same header.
                                  type: string
                                value:
                                  description: The header field value
                                  type: string
                              required:
                              - name
                              - value
                              type: object
                            type: array
                            x-kubernetes-list-type: atomic
                          path:
                            description: Path to access on the HTTP server.
                            type: string
                          port:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              Name or number of the port to access on the container.
                              Number must be in the range 1 to 65535.
                              Name must be an IANA_SVC_NAME.
                            x-kubernetes-int-or-string: true
                          protocol:
                            description: |-
                              Protocol selects the wire protocol for the probe connection.
                              Nil defaults to HTTP/1.1.
                            type: string
                          scheme:
                            description: |-
                              Scheme to use for connecting to the host.
                              Defaults to HTTP.
                            type: string
                        required:
                        - port
                        type: object
                      initialDelaySeconds:
                        description: |-
                          Number of seconds after the container has started before liveness probes are initiated.
                          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
                        format: int32
                        type: integer
                      periodSeconds:
                        description: |-
                          How often (in seconds) to perform the probe.
                          Default to 10 seconds. Minimum value is 1.
                        format: int32
                        type: integer
                      successThreshold:
                        description: |-
                          Minimum consecutive successes for the probe to be considered successful after having failed.
                          Defaults to 1. Must be 1 for liveness and startup. Minimum value is 1.
                        format: int32
                        type: integer
                      tcpSocket:
                        description: TCPSocket specifies a connection to a TCP port.
                        properties:
                          host:
                            description: 'Optional: Host name to connect to, defaults
                              to the pod IP.'
                            type: string
                          port:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              Number or name of the port to access on the container.
                              Number must be in the range 1 to 65535.
                              Name must be an IANA_SVC_NAME.
                            x-kubernetes-int-or-string: true
                        required:
                        - port
                        type: object
                      terminationGracePeriodSeconds:
                        description: |-
                          Optional duration in seconds the pod needs to terminate gracefully upon probe failure.
                          The grace period is the duration in seconds after the processes running in the pod are sent
                          a termination signal and the time when the processes are forcibly halted with a kill signal.
                          Set this value longer than the expected cleanup time for your process.
                          If this value is nil, the pod's terminationGracePeriodSeconds will be used. Otherwise, this
                          value overrides the value provided by the pod spec.
                          Value must be non-negative integer. The value zero indicates stop immediately via
                          the kill signal (no opportunity to shut down).
                          This is a beta field and requires enabling ProbeTerminationGracePeriod feature gate.
                          Minimum value is 1. spec.terminationGracePeriodSeconds is used if unset.
                        format: int64
                        type: integer
                      timeoutSeconds:
                        description: |-
                          Number of seconds after which the probe times out.
                          Defaults to 1 second. Minimum value is 1.
                          More info: https://kubernetes.io/docs/concepts/workloads/pods/pod-lifecycle#container-probes
                        format: int32
                        type: integer
                    type: object
                    x-kubernetes-validations:
                    - message: set exactly one of exec, httpGet, tcpSocket and grpc
                      rule: '[has(self.exec), has(self.httpGet), has(self.tcpSocket),
                        has(self.grpc)].filter(x, x).size() == 1'
                    - message: a readiness probe takes no terminationGracePeriodSeconds
                      rule: '!has(self.terminationGracePeriodSeconds)'
                required:
                - image
                - port
                type: object
              notifications:
                description: |-
                  Notifications lets the namespace's Notifiers call this server's
                  tools that Permissions allow, with its credential, on every event they
                  listen for. Off by default: whoever may create a Notifier would
                  otherwise drive any allowed tool, past the agents' toolRefs.
                type: boolean
              permissions:
                additionalProperties:
                  description: Permission decides what happens when an agent calls
                    a tool.
                  enum:
                  - allow
                  - deny
                  - ask
                  type: string
                description: |-
                  Permissions decide per tool whether a call is allowed, denied or must
                  be approved by a human first. "*" applies to tools not listed by name.
                  Without permissions every tool is allowed; with them the list is an
                  allowlist, so a tool matching neither a name nor "*" is denied.
                type: object
              transport:
                default: streamable_http
                description: Transport is how Cadre talks to the server.
                enum:
                - streamable_http
                type: string
              url:
                description: URL is an external server's endpoint.
                pattern: ^https?://
                type: string
            type: object
            x-kubernetes-validations:
            - message: set exactly one of url and managed
              rule: has(self.url) != has(self.managed)
            - message: 'a managed server takes no auth: it runs in the cluster, unauthenticated'
              rule: '!has(self.managed) || !has(self.auth)'
          status:
            description: ToolServerStatus is a ToolServer's status.
            properties:
              conditions:
                description: |-
                  Conditions are the standard Kubernetes conditions; Ready says whether
                  the resource can be used.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
              url:
                description: |-
                  URL is a managed server's endpoint, at its Service, once Cadre runs
                  it.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
