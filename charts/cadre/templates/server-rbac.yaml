apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "cadre.server" . }}
  labels:
    {{- include "cadre.labels" . | nindent 4 }}
---
# What cadre-server needs everywhere: config/rbac/role.yaml, as generated.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cadre.server" . }}
  labels:
    {{- include "cadre.labels" . | nindent 4 }}
rules:
  {{- include "cadre.rules" (dict "root" . "file" "files/server-role.yaml") | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cadre.server" . }}
  labels:
    {{- include "cadre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cadre.server" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "cadre.server" . }}
    namespace: {{ .Release.Namespace }}
---
# Running workloads in Team namespaces: config/rbac/workloads.yaml. Bound
# here cluster-wide only with workloads.clusterWide; otherwise per Team
# namespace, as the chart's README shows.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cadre.server" . }}-workloads
  labels:
    {{- include "cadre.labels" . | nindent 4 }}
rules:
  {{- include "cadre.rules" (dict "root" . "file" "files/server-workloads.yaml") | nindent 2 }}
{{- if .Values.workloads.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "cadre.server" . }}-workloads
  labels:
    {{- include "cadre.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "cadre.server" . }}-workloads
subjects:
  - kind: ServiceAccount
    name: {{ include "cadre.server" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
