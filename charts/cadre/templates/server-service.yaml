apiVersion: v1
kind: Service
metadata:
  name: {{ include "cadre.server" . }}
  labels:
    {{- include "cadre.labels" . | nindent 4 }}
    app.kubernetes.io/name: cadre-server
spec:
  type: {{ .Values.server.service.type }}
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: cadre-server
  ports:
    - name: http
      port: {{ .Values.server.service.port }}
      targetPort: http
