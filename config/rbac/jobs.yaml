# cadre-server starts Jobs for runner agents that have runtime.job, and
# reads the ServiceAccount each Job runs as. It watches Jobs everywhere with
# the cadre-server ClusterRole (role.yaml), which is read-only for them;
# creating and deleting Jobs, and reading ServiceAccounts, it may do only in
# the Team namespaces where this ClusterRole is bound.
#
# The ClusterRole grants nothing by itself. Bind it in each Team namespace
# whose runner agents may have Jobs, with a RoleBinding like the one below
# (replace team-a and cadre-server's ServiceAccount and namespace).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cadre-server-jobs
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cadre-server-jobs
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cadre-server-jobs
subjects:
- kind: ServiceAccount
  name: cadre-server
  namespace: cadre-system
