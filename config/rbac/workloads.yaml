# cadre-server runs workloads in Team namespaces: Jobs for runner agents that
# have runtime.job (noting on each when its pod first runs, an annotation),
# and a Deployment and a Service for each managed ToolServer. It reads the
# ServiceAccount each Job runs as, and Services, uncached. It watches Jobs
# and Deployments everywhere with the cadre-server ClusterRole (role.yaml),
# which is read-only for them; creating, changing and deleting them it may
# do only in the Team namespaces where this ClusterRole is bound.
#
# The ClusterRole grants nothing by itself. Bind it in each Team namespace
# whose runner agents may have Jobs or whose ToolServers may be managed,
# with a RoleBinding like the one below (replace team-a and cadre-server's
# ServiceAccount and namespace).
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cadre-server-workloads
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - create
  - delete
  - patch
- apiGroups:
  - apps
  resources:
  - deployments
  verbs:
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - services
  verbs:
  - get
  - create
  - update
  - delete
- apiGroups:
  - ""
  resources:
  - serviceaccounts
  verbs:
  - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cadre-server-workloads
  namespace: team-a
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cadre-server-workloads
subjects:
- kind: ServiceAccount
  name: cadre-server
  namespace: cadre-system
