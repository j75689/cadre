---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cadre-server
rules:
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - create
  - get
- apiGroups:
  - authentication.k8s.io
  resources:
  - tokenreviews
  verbs:
  - create
- apiGroups:
  - cadre.dev
  resources:
  - agents
  - modelproviders
  - runners
  - toolservers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - cadre.dev
  resources:
  - agents/status
  - modelproviders/status
  - runners/status
  - tasks/status
  - teams/status
  - toolservers/status
  verbs:
  - get
  - update
- apiGroups:
  - cadre.dev
  resources:
  - tasks
  - teams
  verbs:
  - create
  - get
  - list
  - watch
