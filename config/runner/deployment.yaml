# An example cadre-runner Deployment. There is no published image yet:
# build one from cmd/cadre-runner and set it below. --server is
# cadre-server's in-cluster URL.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cadre-runner
  namespace: cadre-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cadre-runner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cadre-runner
    spec:
      serviceAccountName: cadre-runner
      containers:
      - name: cadre-runner
        image: cadre-runner:dev
        args:
        - --server=http://cadre-server.cadre-system.svc:8080
        # Give every replica its own name, shown in status.run.runner.
        - --runner=$(POD_NAME)
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # cadre-runner authenticates to cadre-server with this token,
        # issued for the audience cadre only, and reads it before every
        # request, as the kubelet rotates it.
        volumeMounts:
        - name: cadre-token
          mountPath: /var/run/secrets/cadre
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          capabilities:
            drop: ["ALL"]
      volumes:
      - name: cadre-token
        projected:
          sources:
          - serviceAccountToken:
              audience: cadre
              expirationSeconds: 600
              path: token
