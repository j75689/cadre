---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: schedules.cadre.dev
spec:
  group: cadre.dev
  names:
    kind: Schedule
    listKind: ScheduleList
    plural: schedules
    singular: schedule
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.cron
      name: Cron
      type: string
    - jsonPath: .spec.timezone
      name: Timezone
      type: string
    - jsonPath: .spec.suspend
      name: Suspended
      type: boolean
    - jsonPath: .status.nextScheduleTime
      name: Next
      type: date
    - jsonPath: .status.lastTask
      name: Last task
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Schedule creates a Task on a cron schedule, once per tick.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ScheduleSpec says when to create a task, and which.
            properties:
              cron:
                description: |-
                  Cron is a standard five-field cron expression, or a descriptor such
                  as @daily, in Timezone.
                minLength: 1
                type: string
              jitter:
                description: |-
                  Jitter delays each tick's task by up to this long, by an amount fixed
                  per Schedule and tick, so that schedules on the same cron do not all
                  fire at once. Keep it shorter than the interval between ticks.
                type: string
              suspend:
                description: |-
                  Suspend stops new tasks. A tick that passes while suspended never
                  fires, even once resumed.
                type: boolean
              task:
                description: Task is the spec of every task the Schedule creates.
                properties:
                  assignee:
                    description: Assignee is who works on the task. An unassigned
                      task is never claimed.
                    properties:
                      kind:
                        description: Kind is Agent or User.
                        enum:
                        - Agent
                        - User
                        type: string
                      name:
                        description: Name is the Agent's name in the task's namespace,
                          or the user's name.
                        minLength: 1
                        type: string
                    required:
                    - kind
                    - name
                    type: object
                  description:
                    description: Description is the full statement of the work.
                    type: string
                  labels:
                    description: Labels are free-form tags for filtering the board.
                    items:
                      type: string
                    type: array
                    x-kubernetes-list-type: set
                  parentRef:
                    description: ParentRef makes this task a subtask of another task.
                    properties:
                      name:
                        description: Name is the referenced Task's metadata.name.
                        minLength: 1
                        type: string
                    required:
                    - name
                    type: object
                  priority:
                    default: medium
                    description: Priority orders the task on the board.
                    enum:
                    - low
                    - medium
                    - high
                    - urgent
                    type: string
                  title:
                    description: Title is the one-line summary shown on the board.
                    minLength: 1
                    type: string
                required:
                - title
                type: object
              timezone:
                description: Timezone is the IANA time zone Cron is read in; default
                  UTC.
                type: string
            required:
            - cron
            - task
            type: object
            x-kubernetes-validations:
            - message: a scheduled task has no parent
              rule: '!has(self.task.parentRef)'
          status:
            description: ScheduleStatus is a Schedule's status.
            properties:
              activeSince:
                description: |-
                  ActiveSince is when the Schedule was last seen unsuspended after
                  being suspended, or its creation: no tick before it fires. It is
                  cleared while suspended.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions are the standard Kubernetes conditions; Ready says whether
                  the resource can be used.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastScheduleTime:
                description: LastScheduleTime is the last tick a task was created
                  for.
                format: date-time
                type: string
              lastTask:
                description: LastTask is the name of the last task created.
                type: string
              nextScheduleTime:
                description: NextScheduleTime is when the next task is due, jitter
                  included.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: a Schedule's name is at most 50 characters, so that its tasks'
            names (the name, a dash and 12 digits) fit 63
          rule: size(self.metadata.name) <= 50
    served: true
    storage: true
    subresources:
      status: {}
