---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: agents.cadre.dev
spec:
  group: cadre.dev
  names:
    kind: Agent
    listKind: AgentList
    plural: agents
    singular: agent
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.modelRef
      name: Model
      type: string
    - jsonPath: .spec.runtime.type
      name: Runtime
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Agent is an agent tasks can be assigned to.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              AgentSpec is an agent: what it is told, which model it uses and which
              tools it may call.
            properties:
              description:
                description: Description says what the agent is for, on the board.
                type: string
              effort:
                default: high
                description: |-
                  Effort is how much thinking and token spend the builtin loop asks
                  the model for. It belongs to the agent, not the ModelProvider: one
                  model serves agents that need different depth. Runner agents ignore
                  it.
                enum:
                - low
                - medium
                - high
                - xhigh
                - max
                type: string
              instructions:
                description: Instructions are the agent's system prompt.
                type: string
              modelRef:
                description: ModelRef is the name of a ModelProvider in the same namespace.
                minLength: 1
                type: string
              runtime:
                default:
                  type: builtin
                description: |-
                  Runtime says who runs the agent's tasks; by default Cadre's builtin
                  loop. The object default makes an Agent applied without a runtime
                  builtin too, not typeless.
                properties:
                  execution:
                    description: |-
                      Execution is how a builtin agent's runs are driven: step, a step at
                      a time by any worker (the default), or runtime, one worker for the
                      whole run. Other runtime types run in their runner's process, as
                      runtime. It has no schema default, as the default depends on the
                      type: empty is step for builtin and runtime for the others.
                    enum:
                    - runtime
                    - step
                    type: string
                  job:
                    description: |-
                      Job, for runtime type runner, has cadre-server start a Kubernetes
                      Job for the agent's work: each Job's pod is a runner that claims one
                      run, works it and exits. Runners already running may claim the
                      agent's tasks too.
                    properties:
                      activeDeadline:
                        description: ActiveDeadline bounds a Job's run time; default
                          one hour.
                        type: string
                      maxPending:
                        description: |-
                          MaxPending is how many of the agent's Jobs may wait for work at once;
                          default 2.
                        format: int32
                        minimum: 1
                        type: integer
                      runnerRef:
                        description: |-
                          RunnerRef names a Runner in the agent's namespace that has a
                          serviceAccount and whose labels include the agent's selector: the
                          Jobs' pods run as that ServiceAccount, whatever the template says,
                          and claim with the Runner's labels.
                        minLength: 1
                        type: string
                      template:
                        description: |-
                          Template is the pod a Job runs: the team's runner. Its runner reads
                          CADRE_SERVER, CADRE_NAMESPACE and CADRE_RUNNER (its name, the Job's)
                          and the token at /var/run/secrets/cadre/token, which cadre-server
                          adds, claims once, works the run and exits. The API server checks the
                          template when a Job is created; the schema here does not.
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                    required:
                    - runnerRef
                    - template
                    type: object
                  selector:
                    additionalProperties:
                      type: string
                    description: |-
                      Selector picks the runners that may claim this agent's tasks: every
                      label must match. Labels under the cadre.dev/ prefix are reserved for
                      Cadre (cadre-runner claims builtin agents with
                      cadre.dev/runtime: builtin), so a selector may not use them.
                    type: object
                  type:
                    default: builtin
                    description: |-
                      Type is builtin (Cadre's loop) or runner (any runner whose labels
                      match the selector).
                    enum:
                    - builtin
                    - runner
                    type: string
                type: object
                x-kubernetes-validations:
                - message: selector is for runtime type runner
                  rule: self.type == 'runner' || !has(self.selector)
                - message: runtime type runner needs a selector
                  rule: self.type != 'runner' || (has(self.selector) && size(self.selector)
                    > 0)
                - message: the cadre.dev/ label prefix is reserved
                  rule: '!has(self.selector) || self.selector.all(k, !k.startsWith(''cadre.dev/''))'
                - message: step execution is for runtime type builtin
                  rule: '!has(self.execution) || self.execution == ''runtime'' ||
                    self.type == ''builtin'''
                - message: job is for runtime type runner
                  rule: '!has(self.job) || self.type == ''runner'''
              toolRefs:
                description: |-
                  ToolRefs are the names of ToolServers in the same namespace that the
                  agent may use.
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
            required:
            - modelRef
            type: object
          status:
            description: |-
              ConfigStatus is the status of a configuration resource: whether it can be
              used, and for which generation of its spec that was decided.
            properties:
              conditions:
                description: |-
                  Conditions are the standard Kubernetes conditions; Ready says whether
                  the resource can be used.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: ObservedGeneration is the spec generation the conditions
                  describe.
                format: int64
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
